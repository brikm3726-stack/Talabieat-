<!DOCTYPE html>
<!-- FICHIER GÉNÉRÉ — ne pas modifier à la main.
     Source : index.html à la racine, puis « node tools/generer-applications.js » -->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<!-- La couleur dont le système peint le pourtour de la page.
     js/app.js la remet à celle de l’application dès que l’écran
     d’ouverture s’efface. -->
<meta name="theme-color" content="#1552B8">
<meta name="description" content="Prenez des courses dans votre quartier, livrez et suivez vos gains.">
<title>Talabi Livreur</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛵</text></svg>">

<!-- Application installable sur téléphone -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/img/icons/apple-touch-icon.png">
<!-- iOS ignore le manifeste : ces trois balises sont le seul moyen de lui dire
     d'ouvrir Talabi en plein écran, sans la barre d'adresse de Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- « black-translucent » : SANS LUI, L'APPLICATION NE REMPLIT PAS L'ÉCRAN.
     Avec « default », iOS dessine sa propre barre d'état opaque au-dessus de la
     page : sur un iPhone à encoche, il reste une bande vide en haut, et le
     contenu ne passe jamais dessous. Traduit, il laisse la page monter jusqu'au
     bord — l'heure et la batterie se posent alors PAR-DESSUS, d'où le
     `padding-top: env(safe-area-inset-top)` de la barre du haut, sans lequel le
     nom du quartier finirait caché sous l'horloge. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Talabi Livreur">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body class="app-driver">

<!-- ÉCRAN DE DÉMARRAGE — le mot-marque s'écrit sur fond blanc (4,3 s)
     C'ÉTAIT UNE PHOTO PLEINE PAGE (`assets/img/bg/entrer.jpg`). Elle avait deux
     défauts qu'aucun réglage ne rattrape : elle est rognée dès que le rapport de
     l'écran s'écarte du sien, et elle pèse le poids d'une photo pour un écran
     qu'on regarde quatre secondes. Le mot-marque, lui, est du texte et un tracé
     SVG : net à toute densité, quelques centaines d'octets, et il s'anime.

     TOUT EST ÉCRIT ICI, EN DUR, ET C'EST NÉCESSAIRE. Cet écran doit être peint
     à la première image, avant que le moindre script ne soit lu — un écran
     d'ouverture qui attend le JavaScript arrive après ce qu'il est censé
     couvrir. La photo était posée en CSS pour la même raison.

     Le fichier `entrer.jpg` reste dans le dépôt : l'espace livreur s'en sert
     encore. -->
<div class="splash" id="splash">
  <div class="center">
    <img src="../assets/img/logo.jpg" alt="Talabi" class="splash-logo">
    <div class="splash-sub">Espace livreur • Tizi Ouzou</div>
  </div>
</div>

<!-- barre latérale (espace restaurant, sur grand écran) -->
<aside class="sidenav" id="sidenav" hidden></aside>

<!-- barre supérieure -->
<header class="topbar" id="topbar"></header>

<!-- contenu des pages -->
<main id="view"></main>

<!-- navigation mobile -->
<nav class="bottomnav" id="bottomnav"></nav>

<!-- conteneurs dynamiques -->
<div class="toasts" id="toasts"></div>
<div id="modal-root"></div>

<!-- Supabase JS : base de données, comptes et temps réel -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<!-- Quelle application ouvre-t-on, et à quelle profondeur ?
     Les trois autres (resto/, livreur/, admin/) déclarent la même chose avec
     leurs propres valeurs. Tout le reste du code est identique. -->
<script>
  window.TALABI_APP  = 'driver';
  window.TALABI_BASE = '../';
</script>

<!-- Noyau -->
<script src="../config.js"></script>
<script src="../js/lib/apps.js"></script>
<script src="../js/lib/utils.js"></script>
<script src="../js/lib/ui.js"></script>
<script src="../js/lib/backend-supabase.js"></script>
<script src="../js/lib/api.js"></script>
<script src="../js/lib/store.js"></script>
<script src="../js/lib/router.js"></script>
<script src="../js/lib/shell.js"></script>
<script src="../js/lib/components.js"></script>
<!-- mapengine avant mappicker : le second demande au premier de dessiner -->
<script src="../js/lib/mapengine.js"></script>
<script src="../js/lib/mappicker.js"></script>
<script src="../js/lib/livetrack.js"></script>
<script src="../js/lib/livescreen.js"></script>
<script src="../js/lib/sound.js"></script>
<script src="../js/lib/install.js"></script>

<!-- Vues -->
<script src="../js/views/landing.js"></script>
<script src="../js/views/auth.js"></script>
<script src="../js/views/client.js"></script>
<script src="../js/views/checkout.js"></script>
<script src="../js/views/tracking.js"></script>
<script src="../js/views/restaurant.js"></script>
<script src="../js/views/driver.js"></script>
<script src="../js/views/admin.js"></script>
<script src="../js/views/account.js"></script>

<!-- Démarrage -->
<script src="../js/app.js"></script>
</body>
</html>
