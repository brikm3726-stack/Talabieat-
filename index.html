<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<!-- LE BLANC DE L'ÉCRAN D'OUVERTURE, ET NON LE NOIR DE L'APPLICATION.

     Mesuré sur un iPhone 14 Pro : la fenêtre du navigateur fait 59 pt de moins
     que l'écran, et iOS peint cette bande lui-même — avec CETTE couleur. Aucun
     CSS ne peut l'atteindre : elle est en dehors de la page.

     L'ouverture est désormais un fond blanc sur lequel le mot-marque s'écrit
     (c'était une photo pleine page, `entrer.jpg`, qui se terminait en courbe
     orange — d'où le #E95403 qu'on lisait ici). La bande prend donc le même
     blanc : la jointure disparaît, on voit un écran qui va jusqu'au bord.

     js/app.js repasse au noir de la page dès que l'écran s'efface — sinon
     c'est un bandeau blanc qui resterait au-dessus d'une application sombre. -->
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Talabi — Commandez vos repas préférés en ligne et faites-vous livrer rapidement partout dans la ville de Tizi Ouzou.">
<title>Talabi — Livraison de repas à domicile</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛵</text></svg>">

<!-- Application installable sur téléphone -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/img/icons/apple-touch-icon.png">
<!-- iOS ignore le manifeste : ces trois balises sont le seul moyen de lui dire
     d'ouvrir Talabi en plein écran, sans la barre d'adresse de Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- « black-translucent » : SANS LUI, L'APPLICATION NE REMPLIT PAS L'ÉCRAN.
     Avec « default », iOS dessine sa propre barre d'état opaque au-dessus de la
     page : sur un iPhone à encoche, il reste une bande vide en haut, et le
     contenu ne passe jamais dessous. Traduit, il laisse la page monter jusqu'au
     bord — l'heure et la batterie se posent alors PAR-DESSUS, d'où le
     `padding-top: env(safe-area-inset-top)` de la barre du haut, sans lequel le
     nom du quartier finirait caché sous l'horloge. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Talabi">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="app-client">

<!-- ÉCRAN DE DÉMARRAGE — le mot-marque s'écrit sur fond blanc (4,3 s)
     C'ÉTAIT UNE PHOTO PLEINE PAGE (`assets/img/bg/entrer.jpg`). Elle avait deux
     défauts qu'aucun réglage ne rattrape : elle est rognée dès que le rapport de
     l'écran s'écarte du sien, et elle pèse le poids d'une photo pour un écran
     qu'on regarde quatre secondes. Le mot-marque, lui, est du texte et un tracé
     SVG : net à toute densité, quelques centaines d'octets, et il s'anime.

     TOUT EST ÉCRIT ICI, EN DUR, ET C'EST NÉCESSAIRE. Cet écran doit être peint
     à la première image, avant que le moindre script ne soit lu — un écran
     d'ouverture qui attend le JavaScript arrive après ce qu'il est censé
     couvrir. La photo était posée en CSS pour la même raison.

     Le fichier `entrer.jpg` reste dans le dépôt : l'espace livreur s'en sert
     encore. -->
<div class="splash" id="splash">
  <!--OUVERTURE : ce bloc, et lui seul, est remplacé par le générateur pour
      l'espace livreur et la console (tools/generer-applications.js). Ces deux
      applications gardent leur propre écran de démarrage — la photo pour le
      livreur, le logo sur fond sombre pour la console. Les repères délimitent
      ce qu'il faut échanger : sans eux, le générateur devrait deviner où le
      bloc commence et où il finit. -->
  <div class="ouv">
    <div class="ouv-logo" role="img" aria-label="Talabi">
      <!-- Deux fois le même arc : celui du dessous porte la lueur, en dur, et
           ne fait qu'apparaître en opacité au moment voulu. Animer un
           `filter` obligerait le téléphone à redessiner le flou à chaque
           image — sur les appareils d'entrée de gamme du quartier, c'est la
           différence entre soixante images par seconde et une saccade. -->
      <span class="ouv-arc" aria-hidden="true"><span class="ouv-lueur"><svg viewBox="0 0 132 26"><path d="M6 24C6 24 24 4 66 4s60 20 60 20" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></svg></span><svg viewBox="0 0 132 26"><path d="M6 24C6 24 24 4 66 4s60 20 60 20" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></svg></span>
      <!-- Une lettre par élément, avec son rang : c'est le rang qui décale son
           entrée dans la feuille de style. Aucun espace entre les balises —
           deux `inline-block` séparés par un retour à la ligne se retrouvent
           séparés par une espace, et le mot s'écrirait « t a l a b i ». -->
      <span class="ouv-mot" aria-hidden="true"><span class="ouv-l" style="--i:0">t</span><span class="ouv-l" style="--i:1">a</span><span class="ouv-l" style="--i:2">l</span><span class="ouv-l" style="--i:3">a</span><span class="ouv-l or" style="--i:4">b</span><span class="ouv-l or" style="--i:5">i</span><span class="ouv-brille"></span></span>
    </div>
    <div class="ouv-sub">Livraison de repas • Tizi Ouzou</div>
  </div>
  <!--/OUVERTURE-->
</div>

<!-- barre latérale (espace restaurant, sur grand écran) -->
<aside class="sidenav" id="sidenav" hidden></aside>

<header class="topbar" id="topbar"></header>

<!-- Supabase JS : base de données, comptes et temps réel -->

<!-- Quelle application ouvre-t-on, et à quelle profondeur ?
     Les trois autres (resto/, livreur/, admin/) déclarent la même chose avec
     leurs propres valeurs. Tout le reste du code est identique. -->
<script>
  window.TALABI_APP  = 'client';
  window.TALABI_BASE = '';
</script>
